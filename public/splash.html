<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrossPresenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    html {
      background: transparent;
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      box-sizing: border-box;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #fff;
      position: relative;
    }

    /* Scoped viewport: the splash is bounded to this panel-like container */
    .panel {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, #2e1065 0%, #1a0a3c 30%, #0d0618 60%, #07030f 100%);
    }

    .orb,
    .blob,
    .ring,
    .star,
    .top-line {
      position: absolute;
      pointer-events: none;
    }

    .orb-1 {
      top: -8%;
      left: -12%;
      width: 56vw;
      height: 56vw;
      max-width: 640px;
      max-height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(109, 40, 217, 0.28) 0%, rgba(76, 29, 149, 0.12) 50%, transparent 70%);
      filter: blur(2px);
      animation: orbFloat 7s ease-in-out infinite;
    }

    .orb-2 {
      bottom: -10%;
      right: -10%;
      width: 52vw;
      height: 52vw;
      max-width: 600px;
      max-height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.18) 0%, rgba(8, 145, 178, 0.08) 50%, transparent 70%);
      filter: blur(2px);
      animation: orbFloat2 9s ease-in-out infinite;
    }

    .blob-3 {
      top: 30%;
      right: 8%;
      width: 28vw;
      height: 28vw;
      max-width: 320px;
      max-height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.10) 0%, transparent 70%);
      filter: blur(4px);
    }

    .ring-1 {
      width: min(70vw, 540px);
      height: min(70vw, 540px);
      border-radius: 50%;
      border: 1px solid rgba(139, 92, 246, 0.12);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: rotateSlow 20s linear infinite;
    }

    .ring-2 {
      width: min(52vw, 400px);
      height: min(52vw, 400px);
      border-radius: 50%;
      border: 1px solid rgba(6, 182, 212, 0.10);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .star {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #c4b5fd;
      opacity: 0.5;
    }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 0 24px;
    }

    .logo-glow {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 32%;
      margin-bottom: 2.2rem;
      animation: scaleIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both, pulseGlow 3s ease-in-out infinite;
    }

    .logo-glow img {
      width: min(36vw, 180px);
      height: min(36vw, 180px);
      border-radius: 28%;
      display: block;
      object-fit: contain;
    }

    h1.app-name {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.6rem);
      letter-spacing: 0.12em;
      line-height: 1.05;
      margin-bottom: 0.5rem;
      text-align: center;
      animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both, shimmerText 4s linear infinite;
      background: linear-gradient(90deg, #c084fc 0%, #818cf8 20%, #22d3ee 40%, #f59e0b 55%, #c084fc 70%, #818cf8 85%, #22d3ee 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      margin: 0;
      color: rgba(196, 181, 253, 0.72);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.82rem, 2.2vw, 1.05rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
    }

    .divider {
      width: min(48px, 10vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.6), rgba(6, 182, 212, 0.6), transparent);
      margin-bottom: 3rem;
      animation: fadeIn 1s ease 0.6s both;
    }

    .loading-track {
      width: min(240px, 52vw);
      height: 3px;
      border-radius: 99px;
      background: rgba(109, 40, 217, 0.18);
      overflow: hidden;
      margin-bottom: 1.2rem;
      animation: fadeIn 1s ease 0.7s both;
    }

    .loading-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6, #f59e0b);
      animation: barWidth 9s cubic-bezier(0.4, 0, 0.2, 1) 1s both;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 1s ease 0.9s both;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.7);
      animation: dotBlink 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    .version {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(139, 92, 246, 0.4);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: fadeIn 1s ease 1.3s both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(32px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.72); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 60px 20px rgba(139, 92, 246, 0.35), 0 0 120px 60px rgba(99, 102, 241, 0.15), 0 0 200px 100px rgba(6, 182, 212, 0.08);
      }
      50% {
        box-shadow: 0 0 80px 30px rgba(139, 92, 246, 0.55), 0 0 160px 80px rgba(99, 102, 241, 0.25), 0 0 260px 120px rgba(6, 182, 212, 0.12);
      }
    }
    @keyframes shimmerText {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes orbFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.04); }
    }
    @keyframes orbFloat2 {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(20px) scale(0.97); }
    }
    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes barWidth {
      from { width: 0%; }
      to { width: 100%; }
    }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <div class="panel">
    <!-- Background mesh orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="blob blob-3"></div>

    <!-- Rotating ring accents -->
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>

    <!-- Star particles -->
    <div class="star" style="top:12%;left:18%;opacity:0.5;"></div>
    <div class="star" style="top:22%;left:78%;width:3px;height:3px;opacity:0.4;"></div>
    <div class="star" style="top:68%;left:12%;opacity:0.6;"></div>
    <div class="star" style="top:78%;left:82%;opacity:0.3;"></div>
    <div class="star" style="top:40%;left:5%;opacity:0.4;"></div>
    <div class="star" style="top:55%;left:91%;width:3px;height:3px;opacity:0.5;"></div>
    <div class="star" style="top:88%;left:42%;opacity:0.3;"></div>
    <div class="star" style="top:8%;left:55%;opacity:0.4;"></div>

    <!-- Main content -->
    <div class="content">
      <!-- Logo glow container -->
      <div class="logo-glow">
        <img src="splash-logo.png" alt="CrossPresenter logo">
      </div>

      <!-- App name -->
      <h1 class="app-name">CrossPresenter</h1>

      <!-- Tagline -->
      <p class="tagline">Present with Faith &amp; Cross</p>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Loading bar -->
      <div class="loading-track">
        <div class="loading-bar"></div>
      </div>

      <!-- Loading dots -->
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Bottom version badge -->
    <div class="version">Version 1.0</div>
  </div>
</body>

</html>
