[package]
name = "crosspresenter"
version = "1.0.1"
description = "CrossPresenter — high-performance worship presentation software"
authors = ["CrossPresenter"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "crosspresenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# In-app updates: check GitHub Releases, download and install the signed
# NSIS package, then restart into the new version.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Wireless remote control server (WebSocket on the LAN).
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
local-ip-address = "0.6"
if-addrs = "0.13"
rand = "0.8"
base64 = "0.22"
mdns-sd = "0.11"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Archive engine (.cpshow)
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

# Song import engine
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.37"

# Concurrency for batch imports
rayon = "1"

# Utilities
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
encoding_rs = "0.8"
walkdir = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
