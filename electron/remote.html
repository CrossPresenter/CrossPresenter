<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>CrossPresenter Remote</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#0d0d1a; color:#e2e2f0; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:#13131f; border-bottom:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:space-between; }
  header .logo { color:#7c6af7; font-weight:700; }
  #status { font-size:12px; color:#888; }
  .badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; margin-left:8px; }
  .badge.live { background:#dc2626; color:#fff; }
  .badge.blank { background:#b45309; color:#fde68a; }
  .wrap { flex:1; overflow-y:auto; padding:12px; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  button { border:0; border-radius:12px; padding:16px; font-size:16px; font-weight:600; color:#fff; background:#1e1e2e; border:1px solid rgba(255,255,255,.1); font-family: inherit; }
  button:active { transform: scale(.97); }
  button.primary { background:#7c6af7; }
  button.danger { background:#b91c1c; }
  button.toggled { background:#b45309; }
  .items { display:flex; flex-direction:column; gap:8px; }
  .item { text-align:left; }
  .item.active { border-color:#7c6af7; background:#7c6af7; }
  .item small { display:block; color:#ccc; font-size:12px; margin-top:2px; font-weight:400; }
  #slideInfo { text-align:center; color:#aaa; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <span class="logo">CrossPresenter</span>
  <div><span id="status">Connecting…</span></div>
</header>
<div class="wrap">
  <div class="controls">
    <button class="primary" id="next">Next Slide</button>
    <button id="prev">Prev Slide</button>
    <button id="blank">Blank</button>
    <button id="live">Go Live</button>
    <button id="timer">Timer</button>
    <button class="danger" id="panic">Panic</button>
  </div>
  <div id="slideInfo"></div>
  <div class="items" id="items"></div>
</div>
<script>
var token = new URLSearchParams(location.search).get('t') || '';
var state = null;
function send(cmd) {
  fetch('/api/cmd', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: token, command: cmd }) }).catch(function(){});
}
function fmt(ms) {
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  return (m < 10 ? '0' : '') + m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
}
function render() {
  var el = document.getElementById('status');
  if (!state) { el.textContent = 'Connecting…'; return; }
  el.innerHTML = '<span class="badge' + (state.isLive ? ' live' : '') + '">' + (state.isLive ? 'LIVE' : 'standby') + '</span>' + (state.isBlank ? '<span class="badge blank">BLANK</span>' : '');
  document.getElementById('blank').classList.toggle('toggled', !!state.isBlank);
  document.getElementById('blank').textContent = state.isBlank ? 'Unblank' : 'Blank';
  document.getElementById('live').classList.toggle('toggled', !!state.isLive);
  document.getElementById('live').textContent = state.isLive ? 'Stop Live' : 'Go Live';
  var timerText = '';
  if (state.timerState && state.timerState.endTime) {
    timerText = '   ·   Timer: ' + fmt(Math.max(0, state.timerState.endTime - Date.now()));
  }
  document.getElementById('slideInfo').textContent = 'Slide ' + ((state.activeLyricSlide || 0) + 1) + ' / ' + (state.totalSlides || 1) + timerText;
  var box = document.getElementById('items');
  var order = state.serviceOrder || [];
  box.innerHTML = '';
  for (var i = 0; i < order.length; i++) {
    (function(idx) {
      var d = document.createElement('button');
      d.className = 'item' + (idx === state.activeServiceIndex ? ' active' : '');
      var t = document.createElement('div');
      t.textContent = (idx + 1) + '. ' + order[idx].title;
      d.appendChild(t);
      if (order[idx].detail) {
        var s = document.createElement('small');
        s.textContent = order[idx].detail;
        d.appendChild(s);
      }
      d.onclick = function(){ send({ type: 'item', index: idx }); };
      box.appendChild(d);
    })(i);
  }
}
function poll() {
  fetch('/api/state?t=' + encodeURIComponent(token))
    .then(function(r){ return r.json(); })
    .then(function(s){ state = s; render(); })
    .catch(function(){ state = null; render(); });
}
document.getElementById('next').onclick = function(){ send({ type: 'next' }); };
document.getElementById('prev').onclick = function(){ send({ type: 'prev' }); };
document.getElementById('blank').onclick = function(){ send({ type: 'blank' }); };
document.getElementById('live').onclick = function(){ send({ type: 'live' }); };
document.getElementById('timer').onclick = function(){ send({ type: 'timer' }); };
document.getElementById('panic').onclick = function(){ send({ type: 'panic' }); };
setInterval(poll, 400);
poll();
</script>
</body>
</html>
