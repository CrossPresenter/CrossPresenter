<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d1a">
  <title>Phone Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0d0d1a;
      color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      z-index: 10;
    }
    header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; color: #a89cf7; }
    header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    header .dot.on { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.8); }
    header .dot.off { background: #64748b; }
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; gap: 14px; }
    #preview {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9/16;
      max-height: 62vh;
      object-fit: cover;
      border-radius: 16px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      display: none;
    }
    #preview.visible { display: block; }
    .placeholder {
      width: 100%; max-width: 420px; aspect-ratio: 9/16; max-height: 62vh;
      border-radius: 16px; border: 1px dashed rgba(255,255,255,0.2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; color: rgba(255,255,255,0.4); font-size: 13px; text-align: center; padding: 16px;
    }
    #status { font-size: 13px; min-height: 18px; text-align: center; }
    #status.error { color: #f87171; }
    .controls { display: flex; gap: 10px; padding: 0 16px 20px; }
    button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #7c6af7;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; }
    button.secondary { background: rgba(255,255,255,0.12); }
    button.danger { background: rgba(239,68,68,0.85); }
    #flip { display: none; }
    #flip.visible { display: block; flex: 0 0 64px; }
    .hint { font-size: 11px; color: rgba(255,255,255,0.35); text-align: center; padding: 0 24px 10px; }
  </style>
</head>
<body>
  <header>
    <h1><span id="dot" class="dot off"></span>Phone Camera</h1>
    <span id="fps" style="font-size:12px;color:rgba(255,255,255,0.4)"></span>
  </header>

  <div class="stage">
    <video id="preview" autoplay playsinline muted></video>
    <div id="placeholder" class="placeholder">
      <div style="font-size:34px;">📷</div>
      <div id="placeholderText">Waiting to connect to your computer…</div>
    </div>
    <div id="status">Streaming will start automatically</div>
  </div>

  <div class="controls">
    <button id="flip" class="secondary">⇄ Flip</button>
    <button id="start" class="secondary">Start Camera</button>
    <button id="stop" class="danger" style="display:none">Stop</button>
  </div>

  <div class="hint">Keep this page open. Your phone streams live to CrossPresenter on the PC.</div>

  <script>
    (function () {
      var token = new URLSearchParams(location.search).get('t') || '';
      if (!token) {
        document.getElementById('status').textContent = 'Missing session token. Re-open from CrossPresenter.';
        document.getElementById('status').className = 'error';
        return;
      }

      var video = document.getElementById('preview');
      var placeholder = document.getElementById('placeholder');
      var placeholderText = document.getElementById('placeholderText');
      var status = document.getElementById('status');
      var dot = document.getElementById('dot');
      var fpsEl = document.getElementById('fps');
      var startBtn = document.getElementById('start');
      var stopBtn = document.getElementById('stop');
      var flipBtn = document.getElementById('flip');

      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      var stream = null;
      var facingMode = 'environment';
      var sendTimer = null;
      var lastPostAt = 0;
      var framesSent = 0;
      var fpsTimer = null;
      var isStreaming = false;

      function setStatus(text, isError) {
        status.textContent = text;
        status.className = isError ? 'error' : '';
      }

      function setLive(on) {
        dot.className = on ? 'dot on' : 'dot off';
        placeholder.style.display = on ? 'none' : 'flex';
        video.className = on ? 'visible' : '';
        stopBtn.style.display = on ? 'block' : 'none';
        startBtn.style.display = on ? 'none' : 'block';
        flipBtn.className = on ? 'visible' : '';
        placeholderText.textContent = on ? '' : 'Waiting to connect to your computer…';
      }

      function stopCamera() {
        isStreaming = false;
        if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
        if (fpsTimer) { clearInterval(fpsTimer); fpsTimer = null; }
        if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
        video.srcObject = null;
        video.removeAttribute('src');
        setLive(false);
        setStatus('Camera stopped.');
      }

      function startStreaming() {
        setStatus('Streaming…');
        isStreaming = true;
        framesSent = 0;
        var lastFpsReset = Date.now();
        sendTimer = setInterval(function () {
          if (!stream || !video.videoWidth) return;
          if (document.hidden) return;
          var w = video.videoWidth, h = video.videoHeight;
          if (!w || !h) return;
          var maxDim = 1280;
          if (Math.max(w, h) > maxDim) {
            if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
          ctx.drawImage(video, 0, 0, w, h);
          canvas.toBlob(function (blob) {
            if (!blob) return;
            framesSent++;
            fetch('/api/phoneframe?t=' + encodeURIComponent(token), {
              method: 'POST',
              headers: { 'Content-Type': 'image/jpeg' },
              body: blob
            }).catch(function () {
              setStatus('Lost connection to computer — retrying…', true);
            });
          }, 'image/jpeg', 0.7);
        }, 60);

        fpsTimer = setInterval(function () {
          var elapsed = Date.now() - lastFpsReset;
          var f = Math.round(framesSent * 1000 / elapsed);
          fpsEl.textContent = f + ' fps';
          framesSent = 0;
          lastFpsReset = Date.now();
        }, 1000);
      }

      function startCamera() {
        var constraints = { video: { facingMode: facingMode }, audio: false };
        navigator.mediaDevices.getUserMedia(constraints)
          .then(function (s) {
            stream = s;
            video.srcObject = s;
            video.play().catch(function () {});
            setLive(true);
            setStatus('Streaming…');
            startStreaming();
          })
          .catch(function (err) {
            setStatus('Camera permission denied. Allow access and tap Start.', true);
            console.error('getUserMedia failed', err);
          });
      }

      flipBtn.addEventListener('click', function () {
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        if (stream) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          stream = null;
          startCamera();
        }
      });

      startBtn.addEventListener('click', startCamera);
      stopBtn.addEventListener('click', stopCamera);

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
          fpsEl.textContent = '';
        } else if (isStreaming) {
          startStreaming();
        }
      });

      window.addEventListener('pagehide', stopCamera);

      setLive(false);
      setStatus('Tap Start Camera to begin');
    })();
  </script>
</body>
</html>
