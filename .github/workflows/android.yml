name: Android Remote

on:
  push:
    branches: [main]
    paths:
      - 'CrossPresenter-Android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'mobile-v*'
  pull_request:
    paths:
      - 'CrossPresenter-Android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CrossPresenter-Android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Release signing configured from repository secrets."
          else
            echo "::warning::No Android signing secrets are set; this APK is signed with the debug key and will not be able to update a release-signed install."
          fi

      - name: Read version
        id: version
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          NAME=${VERSION%%+*}
          BUILD=${VERSION#*+}
          if [ "$BUILD" = "$VERSION" ]; then BUILD=1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Check tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ "$TAG" != "mobile-v$VERSION" ]; then
            echo "::error::Tag $TAG does not match pubspec version $VERSION. Bump pubspec first."
            exit 1
          fi

      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "${{ steps.version.outputs.build }}"

      - name: Package APK and checksum
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          OUT="CrossPresenter-Remote-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh "$OUT" "$OUT.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspresenter-remote-${{ steps.version.outputs.name }}
          path: |
            CrossPresenter-Android/CrossPresenter-Remote-*.apk
            CrossPresenter-Android/CrossPresenter-Remote-*.apk.sha256
          if-no-files-found: error

      # Mobile releases must NOT be marked "latest": the desktop updater uses
      # releases/latest/download/latest.json and would break if this release won.
      - name: Publish mobile GitHub release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          APK="CrossPresenter-Remote-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "CrossPresenter Remote v$VERSION" \
              --generate-notes \
              --latest=false
          fi
