name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CrossPresenter-Windows_11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossPresenter-Windows_11/src-tauri
      - run: npm ci
      # The updater signing key is deliberately kept off CI; releases are
      # built locally. This override keeps the verification build unsigned.
      - run: npm run bundle -- --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: crosspresenter-windows
          path: |
            CrossPresenter-Windows_11/src-tauri/target/release/bundle/nsis/*.exe
            CrossPresenter-Windows_11/src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: CrossPresenter-MacOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossPresenter-MacOS/src-tauri
      - run: npm ci
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: crosspresenter-macos
          path: |
            CrossPresenter-MacOS/src-tauri/target/release/bundle/dmg/*.dmg
            CrossPresenter-MacOS/src-tauri/target/release/bundle/macos/*.app

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Crosspresenter-Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Crosspresenter-Linux/src-tauri
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential
      - run: npm ci
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: crosspresenter-linux
          path: |
            Crosspresenter-Linux/src-tauri/target/release/bundle/appimage/*.AppImage
            Crosspresenter-Linux/src-tauri/target/release/bundle/deb/*.deb
